# SnoCast Utah — Netlify configuration
# The repo root IS the publish directory; there is no build step.

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# index.html is a single self-contained file — revalidate it every time so a
# redeploy is picked up immediately, but let the browser reuse it within a minute.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Static assets are content-addressed by deploy — safe to cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
